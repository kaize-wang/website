<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Value of warranty planning and age information versus failure rate</title><desc id="desc">Average cost improvement from Huang et al. 2008 Tables 3 and 6. Integrated versus current policy rises from 22.50 to 82.41 percent as beta one rises from 0.01 to 0.30, while integrated versus approximation falls from 9.95 to 0.36 percent.</desc>
<rect width="960" height="560" fill="white"/>
<g font-family="Arial, sans-serif" fill="#26231f">
<text x="70" y="44" font-size="24" font-weight="600">失效率提高后，规划保修更重要，但精确年龄信息反而更不值钱</text>
<text x="70" y="72" font-size="14" fill="#6b665f">数据来自 Huang et al. (2008), Tables 3 and 6。纵轴为平均成本改善百分比。</text>
</g>
